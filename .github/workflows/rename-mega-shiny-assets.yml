name: Rename shiny Mega assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/rename-mega-shiny-assets.yml']
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Commit renames through signed API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, json, os, subprocess
          from pathlib import Path
          pairs = 'abomosnow:abomasnow|absol:absol|agron:aggron|alakazam:alakazam|altaria:altaria|audino:audino|banette:banette|beedrill:beedrill|blastoise:blastoise|blaziken:blaziken|camerupt:camerupt|charizard x:charizard_x|charizard y:charizard_y|diancie:diancie|galade:gallade|garchomp:garchomp|gardevoir:gardevoir|gengar:gengar|glalie:glalie|gyrados:gyarados|houndoom:houndoom|kanghakhan:kangaskhan|latias:latias|latios:latios|lopunny:lopunny|lucario:lucario|mawile:mawile|mega rayquaza:rayquaza|metagross:metagross|pidgeot:pidgeot|pinsir:pinsir|primal groudon:primal_groudon|primal kypgre:primal_kyogre|sabeleye:sableye|salamance:salamence|sharpedo:sharpedo|slowbro:slowbro|steelix:steelix|swampert:swampert|tyranitar:tyranitar|venesaur:venusaur'
          root = Path('assets/mega_pokemon')
          additions, deletions = [], []
          for pair in pairs.split('|'):
              old, new = pair.split(':')
              source = root / (old + '.png')
              target = root / ('shiny_' + new + '.png')
              if source.exists() and target.exists():
                  raise SystemExit(f'Refusing to overwrite {target}')
              if not source.exists():
                  if target.is_file():
                      continue
                  raise SystemExit(f'Missing source: {source}')
              additions.append({'path': str(target), 'contents': base64.b64encode(source.read_bytes()).decode('ascii')})
              deletions.append({'path': str(source)})
          if not additions:
              print('No renames needed.')
              raise SystemExit(0)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          query = 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }'
          payload = {'query': query, 'variables': {'input': {'branch': {'repositoryNameWithOwner': os.environ['GITHUB_REPOSITORY'], 'branchName': 'main'}, 'expectedHeadOid': head, 'message': {'headline': 'Rename shiny Mega and Primal images to shiny_pokemon filenames'}, 'fileChanges': {'additions': additions, 'deletions': deletions}}}}
          result = subprocess.run(['gh', 'api', 'graphql', '--input', '-'], input=json.dumps(payload), text=True, capture_output=True)
          if result.returncode:
              raise SystemExit(result.stderr or result.stdout)
          response = json.loads(result.stdout)
          if response.get('errors'):
              raise SystemExit(json.dumps(response['errors']))
          print(response['data']['createCommitOnBranch']['commit']['url'])
